     "Manchester City", "Manchester United", Newcastle, Tottenham]
  "Bundesliga":
    ["Bayer Leverkusen", "Bayern Monaco", "Borussia Dortmund",
     "Eintracht Francoforte", Lipsia, Stoccarda]
  "La Liga":
    ["Athletic Bilbao", "Atletico Madrid", Barcellona, Betis, "Real Madrid", Villarreal]
  "Ligue 1":
    [Marsiglia, Monaco, PSG, Rennes, Strasburgo]
