# =============================================================================
# CAMANTRA — Configurazione lega (Fantacalcio Mantra Euroleghe, 8 squadre)
# Fonte: "Regolamento Mantra Euroleghe" fornito dalla lega.
# Questo file e' l'UNICA fonte di verita' del progetto: modifica qui se
# il regolamento cambia (il regolamento e' "soggetto a modifiche fino
# all'inizio della competizione").
# =============================================================================

league:
  name: "Camantra"
  mode: "mantra"            # mantra | classic
  variant: "euroleghe"      # euroleghe | serie_a
  managers: 8               # numero fantallenatori
  platform_draft: "Fantalab"
  platform_play: "Leghe Fantacalcio (Fantagazzetta)"

# ------------------------------------------------------------------ #
# ASTA
# Asta DRAFT a crediti INFINITI: non esiste budget in crediti.
# La risorsa scarsa sono le CHIAMATE (30 per squadra).
# Ordine round 1: sorteggiato. Round >= 2: si riparte dalla squadra con
# FVM di rosa piu' BASSO e si prosegue in ordine crescente di FVM
# (chi ha accumulato meno FVM chiama prima). Meccanica auto-bilanciante.
# ------------------------------------------------------------------ #
draft:
  type: "draft"
  infinite_credits: true
  round1_order: "random"            # sorteggio prima dell'asta
  later_round_order: "team_fvm_asc" # dal round 2: FVM rosa crescente
  # Valuta / metrica ufficiale di riferimento del listone:
  currency_metric: "FVM"

# ------------------------------------------------------------------ #
# ROSA — 3 portieri + 27 di movimento = 30 giocatori.
# "Il mantra non suddivide nettamente D/C/A: sta a te calibrare i ruoli."
# roster_targets = calibrazione CONSIGLIATA dei 27 di movimento (editabile).
# Deve poter coprire tutti i moduli sotto con margine per la panchina.
# ------------------------------------------------------------------ #
roster:
  size_total: 30
  goalkeepers: 3
  outfield: 27
  # Distribuzione target dei 27 di movimento (somma = 27).
  # Pensata per coprire back-3 e back-4 + esterni + trequarti + 2 punte.
  roster_targets:
    Dc: 5     # centrali (perno di ogni difesa a 3/4)
    B: 2      # braccetti (difesa a 3)
    Dd: 2     # terzino destro (Td)
    Ds: 2     # terzino sinistro (Ts)
    E: 4      # esterni di centrocampo
    M: 3      # mediani
    C: 3      # centrali di centrocampo
    W: 2      # ali offensive
    T: 2      # trequartisti
    A: 1      # attaccanti (seconda punta / mobile)
    Pc: 1     # punte centrali
  # NB: molti giocatori sono multi-ruolo (es. "E;W", "A;Pc"): la copertura
  # reale e' migliore di quanto suggerisca il conteggio a ruolo singolo.

# ------------------------------------------------------------------ #
# RUOLI MANTRA — set canonico e reparti.
# Notazione listone: Por, Dc, B, Dd, Ds (a volte Td/Ts), E, M, C, W, T, A, Pc.
# ------------------------------------------------------------------ #
roles:
  canonical: [Por, Dc, B, Dd, Ds, E, M, C, W, T, A, Pc]
  # alias -> canonico (per normalizzare listoni con notazioni diverse)
  aliases:
    P: Por
    Td: Dd     # terzino destro
    Ts: Ds     # terzino sinistro
    "Dd/Ds": Dd
  # macro-reparto (per statistiche/valore, non vincolante nel Mantra)
  department:
    Por: POR
    Dc: DIF
    B: DIF
    Dd: DIF
    Ds: DIF
    E: CEN
    M: CEN
    C: CEN
    W: TRQ
    T: TRQ
    A: ATT
    Pc: ATT

# ------------------------------------------------------------------ #
# MODULI AMMESSI (da Leghe Fantacalcio, come da regolamento).
# Ogni modulo = 11 slot; ogni slot elenca i ruoli AMMESSI ("/" = alternativa).
# Trascritti dai campetti del regolamento; da verificare con la
# "tabella sostituzioni" ufficiale per i casi limite. La copertura usa un
# matching bipartito giocatori<->slot, quindi basta correggere qui.
# ------------------------------------------------------------------ #
modules:
  "3-4-3":
    - [Por]
    - [Dc]
    - [Dc]
    - [Dc, B]
    - [E]
    - [M, C]
    - [C]
    - [E]
    - [W, A]
    - [W, A]
    - [A, Pc]
  "3-5-2":
    - [Por]
    - [Dc]
    - [Dc]
    - [Dc, B]
    - [M]
    - [M, C]
    - [C]
    - [E]
    - [E, W]
    - [A, Pc]
    - [A, Pc]
  "4-3-3":
    - [Por]
    - [Dd]
    - [Dc]
    - [Dc]
    - [Ds]
    - [M, C]
    - [M]
    - [C]
    - [W, A]
    - [W, A]
    - [A, Pc]
  "4-4-2":
    - [Por]
    - [Dd]
    - [Dc]
    - [Dc]
    - [Ds]
    - [M, C]
    - [C]
    - [E]
    - [E, W]
    - [A, Pc]
    - [A, Pc]
  "3-4-1-2":
    - [Por]
    - [Dc]
    - [Dc]
    - [Dc, B]
    - [E]
    - [M, C]
    - [C]
    - [E]
    - [T]
    - [A, Pc]
    - [A, Pc]
  "3-4-2-1":
    - [Por]
    - [Dc]
    - [Dc]
    - [Dc, B]
    - [M]
    - [M, C]
    - [E]
    - [E, W]
    - [T]
    - [T, A]
    - [A, Pc]
  "3-5-1-1":
    - [Por]
    - [Dc]
    - [Dc]
    - [Dc, B]
    - [M]
    - [M]
    - [C]
    - [E, W]
    - [E, W]
    - [T, A]
    - [A, Pc]
  "4-1-4-1":
    - [Por]
    - [Dd]
    - [Dc]
    - [Dc]
    - [Ds]
    - [M]
    - [C, T]
    - [T]
    - [E, W]
    - [W]
    - [A, Pc]
  "4-4-1-1":
    - [Por]
    - [Dd]
    - [Dc]
    - [Dc]
    - [Ds]
    - [M]
    - [C]
    - [E, W]
    - [E, W]
    - [T, A]
    - [A, Pc]
  "4-3-1-2":
    - [Por]
    - [Dd]
    - [Dc]
    - [Dc]
    - [Ds]
    - [M, C]
    - [M]
    - [C]
    - [T]
    - [T, A, Pc]
    - [A, Pc]
  "4-2-3-1":
    - [Por]
    - [Dd]
    - [Dc]
    - [Dc]
    - [Ds]
    - [M]
    - [M, C]
    - [W, T]
    - [T]
    - [W, A]
    - [A, Pc]

# ------------------------------------------------------------------ #
# PUNTEGGIO — bonus/malus (Tabella BONUS/MALUS del regolamento).
# I valori evidenziati/custom della lega sono marcati con NB.
# Servono al modello di valore per stimare i fantapunti attesi.
# ------------------------------------------------------------------ #
scoring:
  goal_threshold: 66        # >= 66 punti squadra = 1 gol
  goal_step: 5              # poi +1 gol ogni +5 punti
  bonus_malus:
    gol_segnato: {Por: 30, Mov: 3}     # NB: Por gol custom lega
    gol_subito: {Por: -1, Mov: -1}
    rigore_segnato: {Por: 3, Mov: 3}
    rigore_sbagliato: {Por: -3, Mov: -3}
    rigore_parato: {Por: 3, Mov: 30}   # NB: verificare (custom/OCR)
    ammonizione: {Por: -0.5, Mov: -0.5}
    espulsione: {Por: -1, Mov: -1}
    assist: {Por: 1, Mov: 1}
    assist_soft: {Por: 1, Mov: 1}
    assist_gold: {Por: 1, Mov: 1}
    autogol: {Por: -1, Mov: -2}        # NB
    porta_inviolata: {Por: 1, Mov: 0}  # NB: +1 (modif. lega)
  # Modificatore difesa: 5 arretrati (Dc,B,Dd,Ds,E,M) + portiere,
  # media dei 5 voti migliori con >=3 tra Dc/B/Dd/Ds.
  defense_modifier:
    department_roles: [Dc, B, Dd, Ds, E, M]
    include_goalkeeper: true
    min_core_defenders: 3      # almeno 3 tra Dc/B/Dd/Ds
    # fasce: [soglia_media_min, bonus]
    bands:
      - [6.00, 1]
      - [6.25, 1]
      - [6.50, 3]
      - [6.75, 3]
      - [7.00, 6]
  # Fattore capitano: modifica sul voto BASE del capitano (senza bonus).
  captain_factor:
    enabled: true
    bands:
      - [0.0, -1.0]     # voto <= 5
      - [5.5, -0.5]     # voto = 5.5
      - [6.0, 0.0]      # voto = 6
      - [6.5, 0.5]      # voto = 6.5
      - [7.0, 1.0]      # voto >= 7

# ------------------------------------------------------------------ #
# GESTIONE GIORNATA
# ------------------------------------------------------------------ #
matchday:
  deadline_minutes_before: 5
  substitutions: 3
  bench_max: 11
  bench_min_gk: 1
  switch: "basic"           # scambio titolare<->riserva stesso ruolo se non parte
  no_module_change: true    # la formazione nasce/muore col modulo scelto
  play_only_when_all_leagues_play: true
  postponed_politico: 6     # 6 politici se rinvio > 30gg / data da destinarsi

# ------------------------------------------------------------------ #
# PENALITA' / ECONOMIA
# ------------------------------------------------------------------ #
penalties:
  missed_lineup_free: 1     # primo skip gratis
  missed_lineup_points: -2  # dalla seconda volta
  missed_lineup_fine_eur: 5
economy:
  entry_fee_eur: 35
  prizes_eur: {1: 115, 2: 75, 3: 55, 4: 35}

# ------------------------------------------------------------------ #
