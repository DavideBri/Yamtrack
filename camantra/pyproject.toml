[project]
name = "camantra"
version = "0.1.0"
description = "Draft assistant per Fantacalcio Mantra Euroleghe (lega Camantra)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "streamlit>=1.32",
    "altair>=5.0",
]

[project.optional-dependencies]
scrape = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
camantra-sample = "camantra.ingest.sample:_cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["camantra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
